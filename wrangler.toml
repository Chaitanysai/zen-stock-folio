# Cloudflare Pages configuration.
#
# Inert until a staging deploy is explicitly approved: this file creates no
# resource by itself. Pages serves `dist/` and automatically bundles the
# Pages Functions in `functions/` (routes: functions/api/<path>.ts -> /api/<path>).
name = "zenfolio"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[vars]
# Non-secret configuration only. Secrets are set with
#   wrangler pages secret put <NAME>
# and locally in `.dev.vars` (gitignored).
#
# ALLOWED_ORIGINS: comma-separated allowlist for cross-origin requests.
# Leave empty for a same-origin-only deployment — same-origin SPA calls send no
# Origin header and need no CORS grant.
# ALLOWED_ORIGINS = "https://zenfolio.pages.dev,http://localhost:8080"

# Public Firebase web API key (same value as VITE_FIREBASE_API_KEY). This is
# NOT a secret: it ships in the browser bundle and access is enforced by
# Firebase Auth and firestore.rules. Pages Functions use it for Identity
# Toolkit token verification, so it must be present in every deployment.
FIREBASE_API_KEY = "AIzaSyDcKFGeZv2ov8M7SYdv-Q4H3JPhpOhncXQ"

# Public HTTPS origin used to build provider callback URLs and the
# post-callback redirect. Never taken from a request header, so a spoofed Host
# cannot redirect the callback to another site.
BROKER_PUBLIC_ORIGIN = "https://zenfolio-7jd.pages.dev"

# --- INDmoney broker sync ---------------------------------------------------
# Enabled for the production deployment at the operator's request on
# 2026-11-01. The probe in docs/api-integration/indmoney-probe.md has NOT been
# completed, so the adapter's field mappings are unverified against a live
# account. Removing INDSTOCKS_BASE_URL disables both broker routes (503
# BROKER_DISABLED) without a code change.
FIREBASE_PROJECT_ID = "zen-stock-folio"
INDSTOCKS_BASE_URL = "https://api.indstocks.com"
#
# Secrets (never in this file):
#   wrangler pages secret put INDSTOCKS_API_KEY
#   wrangler pages secret put BROKER_TOKEN_KEY

# --- EOD price cache --------------------------------------------------------
# Cloudflare KV binding for the EOD price cache. Created 2026-10-27 for the
# `zenfolio` Pages project. One namespace per Pages project (preview and
# production deployments of the same project share it); the cache is
# disposable market data, so sharing cannot leak user state.
#
# Without this binding `functions/api/_lib/kvPriceCache.ts` is a full no-op and
# the API serves live data only.
[[kv_namespaces]]
binding = "PRICE_CACHE"
id = "27cfa83891f2434682e05d9684c69e47"

# --- Broker connection store -------------------------------------------------
# Server-only KV namespace for broker connection metadata, one-time
# authorization state, encrypted credential envelopes and the sync ledger.
# It is NOT created automatically: this file creates no resource. See
# docs/brokers/setup.md.
#
#   wrangler kv namespace create zenfolio-broker-store-production
#   wrangler kv namespace create BROKER_STORE                        # preview
#
# This file is the source of truth for Pages configuration. `vars` and
# `kv_namespaces` are NOT inherited by `env.*`, so the top-level entries are
# production-only and the preview section repeats the ones it needs. Each
# environment has its own namespace: preview and production must never share
# the records that hold encrypted credentials.
#
# The secret `BROKER_CREDENTIALS_KEYS` cannot live in this file; set it per
# environment with
#   npx wrangler pages secret put BROKER_CREDENTIALS_KEYS --project-name zenfolio --env preview
#   npx wrangler pages secret put BROKER_CREDENTIALS_KEYS --project-name zenfolio --env production
# Without the secret (and the binding) every broker endpoint fails closed with
# `setup_required`.
[[kv_namespaces]]
binding = "BROKER_STORE"
id = "1e6435f0a62f4ff6baee8141ddb5264f"

[env.preview.vars]
FIREBASE_API_KEY = "AIzaSyDcKFGeZv2ov8M7SYdv-Q4H3JPhpOhncXQ"
# `vars` are not inherited by environments, so every non-secret value the
# Functions read must be repeated here. Without FIREBASE_PROJECT_ID the preview
# API fails closed with "Firestore project is not configured" (2026-11-08).
FIREBASE_PROJECT_ID = "zen-stock-folio"
# Origin used for provider callback URLs. The suffixed branch alias is the one
# Cloudflare assigned to this branch after the plain alias stopped resolving to
# the newest preview (it stayed pinned to the 2026-10-29 deployment), so the
# callback and post-auth redirect URLs must use it.
BROKER_PUBLIC_ORIGIN = "https://feat-obsidian-dashboard-k07d.zenfolio-7jd.pages.dev"

[[env.preview.kv_namespaces]]
binding = "PRICE_CACHE"
id = "27cfa83891f2434682e05d9684c69e47"

[[env.preview.kv_namespaces]]
binding = "BROKER_STORE"
id = "a91188ff12e24f2096fc8911de49fb6a"
