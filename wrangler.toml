# Cloudflare Pages configuration.
#
# Inert until a staging deploy is explicitly approved: this file creates no
# resource by itself. Pages serves `dist/` and automatically bundles the
# Pages Functions in `functions/` (routes: functions/api/<path>.ts -> /api/<path>).
name = "zenfolio"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[vars]
# Non-secret configuration only. Secrets are set with
#   wrangler pages secret put <NAME>
# and locally in `.dev.vars` (gitignored).
#
# ALLOWED_ORIGINS: comma-separated allowlist for cross-origin requests.
# Leave empty for a same-origin-only deployment — same-origin SPA calls send no
# Origin header and need no CORS grant.
# ALLOWED_ORIGINS = "https://zenfolio.pages.dev,http://localhost:8080"

# Public Firebase web API key (same value as VITE_FIREBASE_API_KEY). This is
# NOT a secret: it ships in the browser bundle and access is enforced by
# Firebase Auth and firestore.rules. Pages Functions use it for Identity
# Toolkit token verification, so it must be present in every deployment.
FIREBASE_API_KEY = "AIzaSyDcKFGeZv2ov8M7SYdv-Q4H3JPhpOhncXQ"

# --- EOD price cache --------------------------------------------------------
# Cloudflare KV binding for the EOD price cache. Created 2026-10-27 for the
# `zenfolio` Pages project. One namespace per Pages project (preview and
# production deployments of the same project share it); the cache is
# disposable market data, so sharing cannot leak user state.
#
# Without this binding `functions/api/_lib/kvPriceCache.ts` is a full no-op and
# the API serves live data only.
[[kv_namespaces]]
binding = "PRICE_CACHE"
id = "27cfa83891f2434682e05d9684c69e47"

# --- Broker connection store -------------------------------------------------
# Server-only KV namespace for broker connection metadata, one-time
# authorization state, encrypted credential envelopes and the sync ledger.
# It is NOT created automatically: this file creates no resource. See
# docs/brokers/setup.md.
#
#   wrangler kv namespace create BROKER_STORE
#
# This file is the source of truth for Pages configuration, so the binding and
# the callback origin are declared per environment below. `vars` and
# `kv_namespaces` are NOT inherited by `env.*`, so the preview section repeats
# the production values it must keep. Top level stays production-only:
# binding the broker store to production is a separate release decision.
#
# The secret `BROKER_CREDENTIALS_KEYS` cannot live in this file; set it with
#   npx wrangler pages secret put BROKER_CREDENTIALS_KEYS --project-name zenfolio --env preview
# Without it (and without the binding below) every broker endpoint fails closed
# with `setup_required`.
[env.preview.vars]
FIREBASE_API_KEY = "AIzaSyDcKFGeZv2ov8M7SYdv-Q4H3JPhpOhncXQ"
# Origin used for provider callback URLs. The branch alias always serves the
# newest preview of this branch, so the registered redirect URL stays valid
# across preview uploads.
BROKER_PUBLIC_ORIGIN = "https://feat-obsidian-dashboard.zenfolio-7jd.pages.dev"

[[env.preview.kv_namespaces]]
binding = "PRICE_CACHE"
id = "27cfa83891f2434682e05d9684c69e47"

[[env.preview.kv_namespaces]]
binding = "BROKER_STORE"
id = "a91188ff12e24f2096fc8911de49fb6a"
